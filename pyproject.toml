[project]
name = "boox-library"
version = "0.1.0"
description = "Repeatable, metadata-correct ebook library sync for BOOX readers"
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "pyyaml>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
