# boox-library configuration
#
# Everything the pipeline needs to turn a messy download folder into a
# tidy, metadata-correct library on the Boox.  Edit freely; the tool is
# idempotent, so re-running after a change is safe.

sources:
  root: ~/Downloads/books
  # relative to root; matched on the first path component
  exclude_paths:
    - Web           # e.g. a code checkout next to your books
    - .git

device:
  # find this in Settings -> Transfer -> BOOX Drop on the device
  host: http://192.168.1.50:8085
  books_root: /storage/emulated/0/Books
  # keep this many bytes free after a sync
  min_free_bytes: 500000000

naming:
  # "sort" -> "Doe, Jane"     (groups by surname; recommended)
  # "natural" -> "Jane Doe"
  author_style: sort
  author_folder_style: sort
  max_filename_len: 140

formats:
  # what counts as an ebook in the source tree
  extensions:
    epub, mobi, azw, azw3, pdf, djvu, fb2, lit, txt, cbz, cbr, chm, pdb, doc, docx, rtf, odt
  # when the same book exists in several formats, keep the best one
  preference:
    epub: 100
    azw3: 90
    mobi: 80
    azw: 70
    fb2: 60
    pdf: 50
    djvu: 40
    lit: 30
    docx: 25
    doc: 24
    rtf: 20
    odt: 19
    txt: 10
    cbz: 5
    cbr: 4
  # image-heavy books read better as PDF even when an EPUB exists
  prefer_pdf_for_categories:
    Cooking & Food: true
    Art & Design: true
  # EPUBs under this many bytes are usually broken link-dumps; prefer PDF/other
  tiny_epub_bytes: 80000
  # The BOOX index ignores these formats entirely, so convert on the way out.
  # .djvu books uploaded as-is never appear in the reader.
  convert:
    djvu: pdf

# ---------------------------------------------------------------------------
# Categories.  First match wins, so put specific ones before general ones.
# `keywords` are matched case-insensitively against title + embedded tags +
# series.  `authors` match the whole author string (case-insensitive).
