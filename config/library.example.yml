# ---------------------------------------------------------------------------
# Explicit overrides.  Highest priority; use these to fix anything the rules
# get wrong.  Keys are matched case-insensitively, substring, against the
# author string or the title.
# ---------------------------------------------------------------------------
overrides:
  # Highest priority.  Matched case-insensitively, as a substring, against the
  # author string or the title.  Use these to fix anything the rules get wrong.
  authors: {}
    # "ursula k. le guin": Fiction
    # "jane doe": History
  titles: {}
    # "the goal": Business & Economics

# Source sub-directories that hint at a category.  Only a hint: a strong
# keyword match still wins.
directory_category: {}
  # "Sci-Fi reading list": Fiction
